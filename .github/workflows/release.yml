name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::package.json version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          grep -q "Version = \"$version\"" Runtime/Facade/JTLSDK.cs || { echo "::error::JTLSDK.Version does not match package.json version $version"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bridge is up to date
        working-directory: Bridge~
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../Runtime
      - name: Package archive
        run: |
          mkdir -p dist stage/com.jtlstudio.sdk
          rsync -a --exclude .git --exclude .github --exclude dist --exclude stage --exclude "Bridge~/node_modules" ./ stage/com.jtlstudio.sdk/
          cd stage
          zip -qr "../dist/com.jtlstudio.sdk-${GITHUB_REF_NAME#v}.zip" com.jtlstudio.sdk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
